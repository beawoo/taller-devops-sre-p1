name: Taller1
on:
  push:
    branches: [main]

  workflow_dispatch:
permissions:
  contents: read

jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: escanear vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-path: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'


  deploy:
    runs-on: ubuntu-latest
    #artefactos entre jobs 
    steps:
      - name: obtener el codigo 
        uses: actions/checkout@v7

      - name: crear carpeta en el servidor 
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.IP_PUBLICA}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          source: "app.py,profile.json,requirements.txt,Dockerfile,compose.yaml,.dockerignore,templates,static"
          target: "/home/${{secrets.USERNAME}}/proyecto1"
          overwrite: true


      - name: levantar contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_PUBLICA}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          script: |
            cd /home/${{secrets.USERNAME}}/proyecto1
            docker compose down 
            docker compose up -d --build 


